# Canton Sandbox — Persistent H2 Storage Config
# Used in production Docker deployment to persist ledger data across restarts.
#
# Start with: daml sandbox --config canton.conf
# (used automatically in Docker via CMD in sandbox/Dockerfile)

canton {
  participants {
    sandbox {
      storage {
        type = h2
        config {
          url = "jdbc:h2:/data/canton.db;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000;AUTO_SERVER=TRUE"
          user = ""
          password = ""
        }
      }

      ledger-api {
        port = 6865
        address = "0.0.0.0"
      }

      http-ledger-api {
        server {
          port = 7575
          address = "0.0.0.0"
        }
      }
    }
  }
}
