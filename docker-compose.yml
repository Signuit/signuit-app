# SignUIT — Production Docker Compose
# Deploy: docker compose up -d
# Server: 38.49.213.142 | Domain: signuit.com

services:
  # ─── Reverse Proxy + SSL ──────────────────────────────────────────────────
  traefik:
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - signuit-network
    restart: unless-stopped

  # ─── Canton Sandbox (Daml Ledger) ────────────────────────────────────────
  canton-sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    volumes:
      - canton-data:/data          # H2 persistent ledger storage
      - ./sandbox:/workspace:ro    # DAR file + canton.conf
    networks:
      - signuit-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7575"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    # NOT exposed to host — only the web app connects internally

  # ─── Web Application (TanStack Start SSR) ───────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Canton — internal Docker network
      CANTON_API_URL: http://canton-sandbox:7575
      # Database — persistent Docker volume
      DATABASE_URL: file:/data/signuit.db
      # Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${DOMAIN}
      CORS_ORIGIN: https://${DOMAIN}
      # Nexus session
      SESSION_SECRET: ${SESSION_SECRET}
      SANDBOX_SECRET: ${SANDBOX_SECRET}
      OPERATOR_PARTY_ID: SignUIT
    volumes:
      - db-data:/data              # SQLite persistent storage
    depends_on:
      canton-sandbox:
        condition: service_healthy
    networks:
      - signuit-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.signuit.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.signuit.entrypoints=websecure"
      - "traefik.http.routers.signuit.tls.certresolver=letsencrypt"
      - "traefik.http.services.signuit.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  signuit-network:
    driver: bridge

volumes:
  canton-data:    # Daml ledger — H2 file, persists across restarts
  db-data:        # SQLite auth DB — users, sessions
  letsencrypt:    # Let's Encrypt certificates
